# The test suite on each system ARES runs on, when started by hand.
name: Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-2025, python: "3.11.2", tag: windows-x64 }
          - { name: macOS Apple Silicon, os: macos-15, python: "3.11.2", tag: macos-arm64 }
          - { name: macOS Intel, os: macos-15-intel, python: "3.11.2", tag: macos-x86_64 }
          - { name: Linux, os: ubuntu-22.04, python: "3.12", tag: linux-x86_64 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Linux needs a display and the fonts for the windows
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-liberation
      - uses: actions/cache@v4
        with:
          path: vendor/${{ matrix.tag }}
          key: toolchain-${{ matrix.tag }}-${{ hashFiles('tools/toolchain.json') }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/fetch_toolchain.py
      - name: Tests
        if: runner.os != 'Linux'
        shell: bash
        env:
          ARES_TEST_LIMIT: ${{ runner.os == 'macOS' && 30 || 120 }}
        run: |
          python -m pytest -q -n auto --max-worker-restart=1000 -m "not serial"
          python -m pytest -q -m serial
      - name: Tests, on a virtual display
        if: runner.os == 'Linux'
        env:
          ARES_VIRTUAL_DISPLAY: 1
          ARES_TEST_LIMIT: 120
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24 -dpi 96" python -m pytest -q -m "not serial"
          xvfb-run -a -s "-screen 0 1920x1200x24 -dpi 96" python -m pytest -v -m serial
